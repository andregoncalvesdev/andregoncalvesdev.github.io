<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>André Gonçalves</title>
  <meta name="description" content="André Gonçalves — Code at Uphold">
  <meta name="theme-color" content="#00000f">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="/assets/profile.png">
  <style>
    :root {
      --bg: #00000f;
      --ink: #f2f5ff;
      --dim: rgba(220, 228, 255, 0.62);
      --gutter: clamp(16px, 2.6vw, 44px);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --burst: 0;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter Tight', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    @media (pointer: fine) {
      html.has-gl, html.has-gl * { cursor: none; }
    }

    #gl {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 0;
    }

    .mono {
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    /* ── Loader ─────────────────────────────────────────────────────── */
    .loader {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      pointer-events: none;
    }

    .loader-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .loader-count {
      color: var(--dim);
      font-variant-numeric: tabular-nums;
      transition: opacity 0.5s ease, transform 0.9s var(--ease-out);
    }

    .loader-line {
      width: min(22vw, 220px);
      height: 1px;
      background: var(--ink);
      transform: scaleX(0);
      opacity: 0.85;
    }

    .loader.done .loader-count { opacity: 0; transform: translateY(-12px); }
    .loader.done .loader-line { animation: horizon 1.1s var(--ease-out) forwards; }

    @keyframes horizon {
      0%   { transform: scaleX(1); opacity: 0.85; }
      45%  { transform: scaleX(6); opacity: 1; }
      100% { transform: scaleX(9); opacity: 0; }
    }

    /* ── Content ────────────────────────────────────────────────────── */
    .content {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 26px;
      pointer-events: none;
    }

    .profile-photo {
      display: block;
      width: clamp(150px, 24vmin, 250px);
      height: auto;
      opacity: 0;
      transform: scale(calc(0.86 - var(--burst) * 0.06));
      filter: blur(14px);
      transition: opacity 1.6s ease, transform 1.8s var(--ease-out), filter 1.6s ease;
    }

    .is-revealed .profile-photo {
      opacity: 1;
      transform: scale(calc(1 - var(--burst) * 0.06));
      filter: blur(0);
      transition: opacity 1.6s ease, transform 0.6s var(--ease-out), filter 1.6s ease;
    }

    .info {
      text-align: center;
      opacity: calc(1 - var(--burst) * 0.6);
      text-shadow: 0 0 18px rgba(0, 0, 15, 0.9), 0 0 4px rgba(0, 0, 15, 0.8);
    }

    .name {
      font-size: clamp(1rem, 1.7vw, 1.25rem);
      font-weight: 500;
      letter-spacing: 0.03em;
      white-space: nowrap;
      margin-bottom: 10px;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 1.1s ease 0.35s, transform 1.4s var(--ease-out) 0.35s;
    }

    .role {
      color: var(--dim);
      white-space: nowrap;
      opacity: 0;
      transition: opacity 1s ease 0.6s;
    }

    .is-revealed .name { opacity: 1; transform: none; }
    .is-revealed .role { opacity: 1; }

    .hint {
      position: fixed;
      left: 50%;
      bottom: var(--gutter);
      transform: translateX(-50%);
      z-index: 20;
      color: var(--dim);
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.2s ease;
    }

    .hint.is-revealed { opacity: 1; }

    .hint-bar {
      position: relative;
      width: 34px;
      height: 1px;
      background: rgba(220, 228, 255, 0.18);
      overflow: hidden;
    }

    .hint-bar::after {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--ink);
      transform-origin: left;
      transform: scaleX(var(--burst));
    }

    /* ── Cursor ─────────────────────────────────────────────────────── */
    .cursor {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 40;
      width: 64px;
      height: 64px;
      margin: -32px 0 0 -32px;
      pointer-events: none;
      display: none;
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    @media (pointer: fine) {
      .has-gl .cursor { display: block; }
    }

    .cursor.is-visible { opacity: 1; }

    .cursor svg {
      position: absolute;
      inset: 0;
      overflow: visible;
      transform: rotate(-90deg) scale(calc(0.45 + var(--burst) * 0.6));
    }

    .cursor .ring-bg { fill: none; stroke: rgba(220, 228, 255, 0.35); stroke-width: 1; vector-effect: non-scaling-stroke; }
    .cursor .ring-fg { fill: none; stroke: #fff; stroke-width: 1.5; vector-effect: non-scaling-stroke; }
    .cursor .core { fill: #fff; }

    /* ── Fallback (no WebGL) ────────────────────────────────────────── */
    .no-gl .loader { display: none; }
    .no-gl .content .profile-photo,
    .no-gl .content .name,
    .no-gl .content .role { opacity: 1; transform: none; filter: none; }

    @media (prefers-reduced-motion: reduce) {
      .profile-photo, .name, .role, .hint { transition-duration: 0.01ms !important; transition-delay: 0s !important; }
    }

    @media (max-width: 600px) {
      .mono { font-size: 10px; }
    }
  </style>
</head>
<body>
  <canvas id="gl" aria-hidden="true"></canvas>

  <div class="loader" aria-hidden="true">
    <div class="loader-inner">
      <span class="loader-count mono">000</span>
      <span class="loader-line"></span>
    </div>
  </div>

  <main class="content">
    <img src="/assets/profile.png" alt="André Gonçalves" class="profile-photo">
    <div class="info">
      <h1 class="name">André Gonçalves</h1>
      <p class="role mono" aria-label="Code at Uphold"><span class="role-text" aria-hidden="true">Code at Uphold</span></p>
    </div>
  </main>

  <span class="hint mono" aria-hidden="true"><span class="hint-bar"></span><span class="hint-text">Click &amp; hold</span></span>

  <div class="cursor" aria-hidden="true">
    <svg viewBox="0 0 64 64">
      <circle class="ring-bg" cx="32" cy="32" r="30"></circle>
      <circle class="ring-fg" cx="32" cy="32" r="30" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"></circle>
      <circle class="core" cx="32" cy="32" r="2.5"></circle>
    </svg>
  </div>

  <script>
    // If the WebGL module never boots (offline CDN, old browser), show the static version
    setTimeout(function () {
      if (!window.__glBooted) document.documentElement.classList.add('no-gl');
    }, 7000);
  </script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

    const root         = document.documentElement;
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const isCoarse     = matchMedia('(pointer: coarse)').matches;

    // ── DOM ───────────────────────────────────────────────────────────────
    const loaderEl    = document.querySelector('.loader');
    const loaderCount = document.querySelector('.loader-count');
    const loaderLine  = document.querySelector('.loader-line');
    const contentEl   = document.querySelector('.content');
    const photoEl     = document.querySelector('.profile-photo');
    const roleText    = document.querySelector('.role-text');
    const hintEl      = document.querySelector('.hint');
    const cursorEl    = document.querySelector('.cursor');
    const cursorRing  = cursorEl.querySelector('.ring-fg');

    if (isCoarse) document.querySelector('.hint-text').textContent = 'Press & hold';

    // Text decode — glyphs resolve left to right
    const GLYPHS = '01<>/\\_=+*#{}[]';
    const ROLE = roleText.textContent;
    let decodeToken = 0;

    function decode(el, text, duration = 1100) {
      const token = ++decodeToken;
      const start = performance.now();
      const step = () => {
        if (token !== decodeToken) return;
        const p = Math.min((performance.now() - start) / duration, 1);
        const solved = Math.floor(p * text.length);
        let out = '';
        for (let i = 0; i < text.length; i++) {
          const c = text[i];
          out += c === ' ' || i < solved ? c : GLYPHS[(Math.random() * GLYPHS.length) | 0];
        }
        el.textContent = out;
        if (p < 1) requestAnimationFrame(step);
      };
      step();
    }

    function scramble(el, text) {
      const token = ++decodeToken;
      let last = 0;
      const step = (now) => {
        if (token !== decodeToken) return;
        if (now - last > 50) {
          last = now;
          let out = '';
          for (const c of text) out += c === ' ' ? ' ' : GLYPHS[(Math.random() * GLYPHS.length) | 0];
          el.textContent = out;
        }
        requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }

    // ── Renderer ──────────────────────────────────────────────────────────
    const canvas = document.getElementById('gl');
    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
    } catch (err) {
      root.classList.add('no-gl');
      throw err;
    }
    window.__glBooted = true;
    root.classList.add('has-gl');

    let dpr = Math.min(window.devicePixelRatio, 2);
    renderer.setPixelRatio(dpr);
    renderer.setSize(innerWidth, innerHeight);
    renderer.setClearColor(0x00000f, 1);

    const scene  = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.1, 200);
    const group  = new THREE.Group();
    scene.add(group);

    // ── Pointer + trail texture ───────────────────────────────────────────
    // A low-res canvas records the pointer wake; particles read it in the vertex shader
    const trail = {
      canvas: document.createElement('canvas'),
      points: [],
      life: 1.4,
    };
    trail.ctx = trail.canvas.getContext('2d');
    trail.texture = new THREE.CanvasTexture(trail.canvas);

    function resizeTrail() {
      trail.canvas.width  = 256;
      trail.canvas.height = Math.max(64, Math.round(256 * innerHeight / innerWidth));
      trail.radius = 256 * (isCoarse ? 0.11 : 0.075);
    }

    function updateTrail(dt) {
      const { ctx, canvas: c } = trail;
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.globalCompositeOperation = 'lighter';
      for (let i = trail.points.length - 1; i >= 0; i--) {
        const p = trail.points[i];
        p.age += dt;
        if (p.age > trail.life) { trail.points.splice(i, 1); continue; }
        const a = p.age < 0.08 ? p.age / 0.08 : 1 - (p.age - 0.08) / (trail.life - 0.08);
        const intensity = Math.pow(a, 1.6) * p.force;
        const r = trail.radius * (0.55 + p.force * 0.6);
        const x = p.x * c.width, y = p.y * c.height;
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, `rgba(255,255,255,${intensity * 0.55})`);
        g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }
      trail.texture.needsUpdate = true;
    }

    const pointer = { x: innerWidth / 2, y: innerHeight / 2, nx: 0, ny: 0, active: false };
    let lastMove = null;

    function onPointerMove(e) {
      pointer.x = e.clientX;
      pointer.y = e.clientY;
      pointer.nx =  (e.clientX / innerWidth  - 0.5) * 2;
      pointer.ny = -(e.clientY / innerHeight - 0.5) * 2;
      pointer.active = true;

      if (lastMove) {
        const dx = e.clientX - lastMove.x, dy = e.clientY - lastMove.y;
        const speed = Math.hypot(dx, dy);
        const force = Math.min(0.25 + speed / 50, 1);
        // Interpolate so fast swipes leave a continuous wake
        const steps = Math.min(Math.ceil(speed / 14), 8);
        for (let s = 1; s <= steps; s++) {
          const t = s / steps;
          trail.points.push({
            x: (lastMove.x + dx * t) / innerWidth,
            y: (lastMove.y + dy * t) / innerHeight,
            age: 0, force,
          });
        }
      } else {
        trail.points.push({ x: e.clientX / innerWidth, y: e.clientY / innerHeight, age: 0, force: 0.4 });
      }
      if (trail.points.length > 120) trail.points.splice(0, trail.points.length - 120);
      lastMove = { x: e.clientX, y: e.clientY };
      cursorEl.classList.add('is-visible');
    }

    window.addEventListener('pointermove', onPointerMove, { passive: true });
    document.addEventListener('pointerleave', () => { lastMove = null; cursorEl.classList.remove('is-visible'); });

    // ── Hold: sphere → galaxy ─────────────────────────────────────────────
    let holding = false;
    let introDone = false;

    function startHold(e) {
      if (!introDone) return;
      if (e.pointerType !== 'mouse') onPointerMove(e);
      holding = true;
      scramble(roleText, ROLE);
    }

    function endHold() {
      if (!holding) return;
      holding = false;
      decode(roleText, ROLE, 900);
      if (isCoarse) lastMove = null;
    }

    window.addEventListener('pointerdown', startHold);
    window.addEventListener('pointerup', endHold);
    window.addEventListener('pointercancel', endHold);
    window.addEventListener('blur', endHold);
    window.addEventListener('contextmenu', e => e.preventDefault());

    // ── Shaders ───────────────────────────────────────────────────────────
    const NOISE = /* glsl */`
      vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
      vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
      vec4 permute(vec4 x) { return mod289(((x * 34.0) + 10.0) * x); }
      vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

      float snoise(vec3 v) {
        const vec2 C = vec2(1.0 / 6.0, 1.0 / 3.0);
        const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
        vec3 i  = floor(v + dot(v, C.yyy));
        vec3 x0 = v - i + dot(i, C.xxx);
        vec3 g  = step(x0.yzx, x0.xyz);
        vec3 l  = 1.0 - g;
        vec3 i1 = min(g.xyz, l.zxy);
        vec3 i2 = max(g.xyz, l.zxy);
        vec3 x1 = x0 - i1 + C.xxx;
        vec3 x2 = x0 - i2 + C.yyy;
        vec3 x3 = x0 - D.yyy;
        i = mod289(i);
        vec4 p = permute(permute(permute(
                  i.z + vec4(0.0, i1.z, i2.z, 1.0))
                + i.y + vec4(0.0, i1.y, i2.y, 1.0))
                + i.x + vec4(0.0, i1.x, i2.x, 1.0));
        float n_ = 0.142857142857;
        vec3 ns = n_ * D.wyz - D.xzx;
        vec4 j  = p - 49.0 * floor(p * ns.z * ns.z);
        vec4 x_ = floor(j * ns.z);
        vec4 y_ = floor(j - 7.0 * x_);
        vec4 x  = x_ * ns.x + ns.yyyy;
        vec4 y  = y_ * ns.x + ns.yyyy;
        vec4 h  = 1.0 - abs(x) - abs(y);
        vec4 b0 = vec4(x.xy, y.xy);
        vec4 b1 = vec4(x.zw, y.zw);
        vec4 s0 = floor(b0) * 2.0 + 1.0;
        vec4 s1 = floor(b1) * 2.0 + 1.0;
        vec4 sh = -step(h, vec4(0.0));
        vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
        vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;
        vec3 p0 = vec3(a0.xy, h.x);
        vec3 p1 = vec3(a0.zw, h.y);
        vec3 p2 = vec3(a1.xy, h.z);
        vec3 p3 = vec3(a1.zw, h.w);
        vec4 norm = taylorInvSqrt(vec4(dot(p0, p0), dot(p1, p1), dot(p2, p2), dot(p3, p3)));
        p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
        vec4 m = max(0.5 - vec4(dot(x0, x0), dot(x1, x1), dot(x2, x2), dot(x3, x3)), 0.0);
        m = m * m;
        return 105.0 * dot(m * m, vec4(dot(p0, x0), dot(p1, x1), dot(p2, x2), dot(p3, x3)));
      }

      mat2 rot(float a) { float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
    `;

    const sphereVertex = /* glsl */`
      uniform float uTime;
      uniform float uAssemble;
      uniform float uBurst;
      uniform float uSize;
      uniform float uScale;
      uniform float uMotion;
      uniform sampler2D uTouch;

      attribute vec4 aSeed;

      varying vec3  vColor;
      varying float vAlpha;

      ${NOISE}

      void main() {
        // Sphere at rest: a slowly turning shell whose surface flows with noise
        vec3 dir = normalize(position);
        float shell = length(position);
        float flow = snoise(dir * 1.7 + vec3(0.0, uTime * 0.12, uTime * 0.08));
        vec3 target = dir * shell * (1.0 + flow * 0.018 * uMotion);
        target.xz = rot(uTime * 0.07 * uMotion) * target.xz;
        target.yz = rot(0.35) * target.yz;

        // Origin: a three-armed spiral galaxy, tilted toward the camera
        float arm  = floor(aSeed.y * 3.0);
        float r    = 0.3 + pow(aSeed.x, 0.7) * 8.0;
        float ang  = arm * 2.0944 + r * 0.7 + (aSeed.z - 0.5) * 1.1 - uTime * 0.6 / (0.6 + r * 0.25);
        vec3 galaxy = vec3(cos(ang) * r, (aSeed.w - 0.5) * (0.25 + r * 0.06), sin(ang) * r);
        galaxy.yz = rot(-1.15) * galaxy.yz;

        // Staggered assembly — the galaxy collapses into the sphere
        float delay = aSeed.x * 0.36 + (0.5 - dir.y * 0.5) * 0.14;
        float t  = clamp((uAssemble - delay) / 0.5, 0.0, 1.0);
        float e  = 1.0 - pow(1.0 - t, 4.0);
        float fl = sin(e * 3.14159);

        vec3 pos = mix(galaxy, target, e);
        pos.xy = rot((1.0 - e) * (aSeed.y - 0.5) * 3.0) * pos.xy;
        pos += vec3(
          snoise(vec3(aSeed.xy * 4.0, uTime * 0.3)),
          snoise(vec3(aSeed.yz * 4.0, uTime * 0.3 + 5.0)),
          snoise(vec3(aSeed.zw * 4.0, uTime * 0.3 + 11.0))
        ) * fl * 1.1;

        // Hold: the sphere unwinds into an orbiting galactic disc
        float b  = smoothstep(aSeed.z * 0.4, aSeed.z * 0.4 + 0.6, uBurst);
        float vr = 1.0 + pow(aSeed.x, 0.8) * 5.0;
        float va = aSeed.y * 6.28318 + vr * 0.35 + uTime * 2.2 / (0.5 + vr * 0.32);
        vec3 vortex = vec3(cos(va) * vr, (aSeed.w - 0.5) * (0.05 + vr * 0.035), sin(va) * vr);
        vortex.yz = rot(-0.32) * vortex.yz;
        vortex.xy = rot(0.16) * vortex.xy;
        vortex += vec3(snoise(vec3(aSeed.xw * 3.0, uTime * 0.5))) * 0.25;
        pos = mix(pos, vortex, b);

        // Pointer wake, sampled in screen space
        vec4 clip = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
        vec2 suv  = clip.xy / clip.w * 0.5 + 0.5;
        float touch = texture2D(uTouch, suv).r * (1.0 - b);
        float ta = aSeed.w * 6.28318 + uTime * 0.5;
        pos.xy += vec2(cos(ta), sin(ta)) * touch * (0.15 + aSeed.x * 0.55);
        pos.z  += touch * (0.4 + aSeed.y * 1.6);

        vec4 mv = modelViewMatrix * vec4(pos, 1.0);
        gl_Position = projectionMatrix * mv;

        float size = uSize * (0.75 + aSeed.z * 0.5);
        size *= 1.0 + touch * 0.9;
        size *= mix(1.0 + (1.0 - e) * 0.5, 0.75 + aSeed.w * 0.6, b);
        gl_PointSize = max(size * uScale / -mv.z, 1.0);

        vec3 galaxyCol = mix(vec3(0.10, 0.26, 1.0), vec3(0.75, 0.84, 1.0), pow(aSeed.y, 2.0));
        float crest = smoothstep(0.15, 0.7, flow);
        vec3 sphereCol = mix(vec3(0.05, 0.18, 1.0), vec3(0.55, 0.70, 1.0), crest * 0.7 + pow(aSeed.w, 6.0) * 0.6);
        vec3 col = mix(galaxyCol, sphereCol, e);
        vec3 discCol = mix(vec3(0.07, 0.22, 1.0), vec3(0.95, 0.97, 1.0), pow(1.0 - aSeed.x, 4.0));
        col = mix(col, discCol, b);
        col += vec3(0.35, 0.55, 1.0) * touch * 0.7;

        // Clear the sphere's face so the photo and name sit in a calm centre
        float core = mix(0.22, 1.0, smoothstep(0.25, 0.85, length(target.xy) / 3.0));
        core = mix(1.0, core, e * (1.0 - b));

        vColor = col;
        vAlpha = mix(2.2, 1.0, e) * mix(1.0, 1.5, b) * core;
      }
    `;

    const pointFragment = /* glsl */`
      uniform float uOpacity;
      uniform float uGain;
      varying vec3  vColor;
      varying float vAlpha;

      void main() {
        float d = length(gl_PointCoord - 0.5);
        if (d > 0.5) discard;
        // Crisp core with an anti-aliased edge and a faint halo
        float a = 1.0 - smoothstep(0.32, 0.5, d);
        a = a * 0.85 + pow(1.0 - d * 2.0, 3.0) * 0.15;
        gl_FragColor = vec4(vColor * a * vAlpha * uOpacity * uGain, 1.0);
      }
    `;

    // ── Particle sphere ───────────────────────────────────────────────────
    const SPHERE_R = 3.0;
    const COUNT = isCoarse || innerWidth < 700 ? 26000 : 60000;
    const spherePos  = new Float32Array(COUNT * 3);
    const sphereSeed = new Float32Array(COUNT * 4);
    const golden = Math.PI * (3 - Math.sqrt(5));

    for (let i = 0; i < COUNT; i++) {
      // Fibonacci distribution with jitter, mostly on a thin shell plus a faint outer haze
      const y = 1 - (i + 0.5) / COUNT * 2;
      const rr = Math.sqrt(1 - y * y);
      const th = golden * i + (Math.random() - 0.5) * 0.004;
      const haze = Math.random() < 0.035;
      const shell = SPHERE_R * (haze ? 1.05 + Math.random() * 0.4 : 0.99 + Math.random() * 0.01);
      spherePos[i * 3]     = Math.cos(th) * rr * shell;
      spherePos[i * 3 + 1] = y * shell;
      spherePos[i * 3 + 2] = Math.sin(th) * rr * shell;
      for (let k = 0; k < 4; k++) sphereSeed[i * 4 + k] = Math.random();
    }

    const sphereGeo = new THREE.BufferGeometry();
    sphereGeo.setAttribute('position', new THREE.BufferAttribute(spherePos, 3));
    sphereGeo.setAttribute('aSeed', new THREE.BufferAttribute(sphereSeed, 4));

    const sphereMat = new THREE.ShaderMaterial({
      vertexShader: sphereVertex,
      fragmentShader: pointFragment,
      uniforms: {
        uTime:     { value: 0 },
        uAssemble: { value: reduceMotion ? 1 : 0 },
        uBurst:    { value: 0 },
        uSize:     { value: COUNT > 30000 ? 0.032 : 0.042 },
        uScale:    { value: 1 },
        uMotion:   { value: reduceMotion ? 0.2 : 1 },
        uOpacity:  { value: reduceMotion ? 1 : 0 },
        uGain:     { value: 0.4 },
        uTouch:    { value: trail.texture },
      },
      transparent: true,
      depthWrite: false,
      depthTest: false,
      blending: THREE.AdditiveBlending,
    });

    const sphere = new THREE.Points(sphereGeo, sphereMat);
    sphere.frustumCulled = false;
    group.add(sphere);

    // ── Ambient dust for depth ────────────────────────────────────────────
    const DUST = isCoarse ? 700 : 1400;
    const dustPos = new Float32Array(DUST * 3);
    const dustSeed = new Float32Array(DUST);
    for (let i = 0; i < DUST; i++) {
      dustPos[i * 3]     = (Math.random() - 0.5) * 34;
      dustPos[i * 3 + 1] = (Math.random() - 0.5) * 22;
      dustPos[i * 3 + 2] = -14 + Math.random() * 20;
      dustSeed[i] = Math.random();
    }
    const dustGeo = new THREE.BufferGeometry();
    dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
    dustGeo.setAttribute('aSeed', new THREE.BufferAttribute(dustSeed, 1));

    const dustMat = new THREE.ShaderMaterial({
      uniforms: {
        uTime:    { value: 0 },
        uScale:   { value: 1 },
        uOpacity: { value: 0 },
        uGain:    { value: 1 },
        uBurst:   { value: 0 },
      },
      vertexShader: /* glsl */`
        uniform float uTime;
        uniform float uScale;
        uniform float uBurst;
        attribute float aSeed;
        varying vec3  vColor;
        varying float vAlpha;
        void main() {
          vec3 p = position;
          p.y = mod(position.y + 11.0 + uTime * (0.08 + aSeed * 0.12), 22.0) - 11.0;
          p.x += sin(uTime * 0.2 + aSeed * 40.0) * 0.4;
          float sw = uBurst * (1.0 + aSeed) * 0.8;
          float c = cos(sw), s = sin(sw);
          p.xz = mat2(c, -s, s, c) * p.xz;
          vec4 mv = modelViewMatrix * vec4(p, 1.0);
          gl_Position = projectionMatrix * mv;
          float tw = 0.55 + 0.45 * sin(uTime * (1.0 + aSeed * 2.0) + aSeed * 30.0);
          vAlpha = tw * smoothstep(60.0, 8.0, -mv.z) * (0.25 + aSeed * 0.35);
          vColor = mix(vec3(0.25, 0.42, 1.0), vec3(0.85, 0.9, 1.0), aSeed);
          gl_PointSize = clamp((0.02 + aSeed * 0.035) * uScale / -mv.z, 1.0, 5.0);
        }
      `,
      fragmentShader: pointFragment,
      transparent: true,
      depthWrite: false,
      depthTest: false,
      blending: THREE.AdditiveBlending,
    });
    const dust = new THREE.Points(dustGeo, dustMat);
    dust.frustumCulled = false;
    scene.add(dust);

    // ── Post-processing ───────────────────────────────────────────────────
    const composer = new EffectComposer(renderer);
    composer.setPixelRatio(dpr);
    composer.setSize(innerWidth, innerHeight);
    composer.addPass(new RenderPass(scene, camera));

    const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.35, 0.3, 0.45);
    composer.addPass(bloom);

    const finalPass = new ShaderPass({
      uniforms: {
        tDiffuse:    { value: null },
        uTime:       { value: 0 },
        uAberration: { value: 0.003 },
        uGlow:       { value: 0 },
        uGlowCenter: { value: new THREE.Vector2(0.5, 0.5) },
        uAspect:     { value: innerWidth / innerHeight },
      },
      vertexShader: /* glsl */`
        varying vec2 vUv;
        void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
      `,
      fragmentShader: /* glsl */`
        uniform sampler2D tDiffuse;
        uniform float uTime;
        uniform float uAberration;
        uniform float uGlow;
        uniform vec2  uGlowCenter;
        uniform float uAspect;
        varying vec2 vUv;

        float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }

        void main() {
          vec2 c = vUv - 0.5;
          float r = length(c * vec2(uAspect, 1.0)) / max(uAspect, 1.0);
          vec2 off = c * uAberration * (0.35 + r * 2.4);

          vec3 col;
          col.r = texture2D(tDiffuse, vUv + off).r;
          col.g = texture2D(tDiffuse, vUv).g;
          col.b = texture2D(tDiffuse, vUv - off * 1.4).b;

          // Deep navy base with a soft halo at the centre
          vec2 g = (vUv - uGlowCenter) * vec2(uAspect, 1.0);
          col += vec3(0.0, 0.0, 0.06);
          col += vec3(0.02, 0.05, 0.28) * exp(-dot(g, g) * 5.0) * uGlow;

          // Vignette
          col *= mix(1.0, 0.35, smoothstep(0.35, 1.0, length(c * vec2(1.0, 1.15)) * 1.35));

          // Film grain
          float n = hash(vUv * 1000.0 + fract(uTime * 7.31) * 100.0);
          col += (n - 0.5) * 0.012;

          gl_FragColor = vec4(max(col, 0.0), 1.0);
        }
      `,
    });
    composer.addPass(finalPass);

    // ── Layout ────────────────────────────────────────────────────────────
    let baseDist = 14;
    let groupY = 0;

    function resize() {
      const w = innerWidth, h = innerHeight, aspect = w / h;
      dpr = Math.min(window.devicePixelRatio, 2);
      renderer.setPixelRatio(dpr);
      renderer.setSize(w, h);
      composer.setPixelRatio(dpr);
      composer.setSize(w, h);
      camera.aspect = aspect;
      camera.updateProjectionMatrix();

      // Fit the sphere to the viewport
      const tanHalf = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
      const diameter = SPHERE_R * 2;
      const distH = (diameter / 0.72) / 2 / tanHalf;
      const distW = (diameter / 0.92) / 2 / tanHalf / aspect;
      baseDist = Math.max(distH, distW) + SPHERE_R;

      // Centre the sphere on the photo
      const visibleH = 2 * (baseDist) * tanHalf;
      const pr = photoEl.getBoundingClientRect();
      const photoY = pr.height ? (pr.top + pr.height / 2) / h : 0.5;
      groupY = (0.5 - photoY) * visibleH;
      finalPass.uniforms.uGlowCenter.value.set(0.5, 1 - photoY);
      finalPass.uniforms.uAspect.value = aspect;

      const scale = renderer.domElement.height * 0.5 * camera.projectionMatrix.elements[5];
      sphereMat.uniforms.uScale.value = scale;
      dustMat.uniforms.uScale.value = scale;

      resizeTrail();
    }

    window.addEventListener('resize', resize);
    photoEl.addEventListener('load', resize);

    // ── Timeline ──────────────────────────────────────────────────────────
    const clamp01   = v => Math.min(Math.max(v, 0), 1);
    const easeOut3  = t => 1 - Math.pow(1 - t, 3);
    const easeInOut = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    const lerp      = (a, b, t) => a + (b - a) * t;

    const LOADER_MIN = reduceMotion ? 0 : 1.4;
    let ready = false;
    let loaderDoneAt = null;
    let revealed = false;
    let burst = 0;
    let shownProgress = 0;
    const cursorPos = { x: innerWidth / 2, y: innerHeight / 2 };
    const camLook = new THREE.Vector3();
    const smooth = { x: 0, y: 0 };

    function reveal() {
      if (revealed) return;
      revealed = true;
      contentEl.classList.add('is-revealed');
      setTimeout(() => decode(roleText, ROLE, 1400), reduceMotion ? 0 : 900);
      setTimeout(() => hintEl.classList.add('is-revealed'), reduceMotion ? 0 : 1800);
    }

    const start = performance.now();
    let prev = start;

    function frame(now) {
      requestAnimationFrame(frame);
      const t  = (now - start) / 1000;
      const dt = Math.min((now - prev) / 1000, 0.05);
      prev = now;

      // Loader counts while the photo and fonts load
      const target = Math.min(LOADER_MIN ? t / LOADER_MIN : 1, ready ? 1 : 0.9);
      shownProgress += (target - shownProgress) * (1 - Math.exp(-dt * 10));
      if (target >= 1 && shownProgress > 0.995) shownProgress = 1;
      if (loaderDoneAt === null) {
        loaderCount.textContent = String(Math.round(shownProgress * 100)).padStart(3, '0');
        loaderLine.style.transform = `scaleX(${shownProgress})`;
        if (shownProgress === 1 && ready) {
          loaderDoneAt = t;
          loaderEl.classList.add('done');
          loaderLine.style.transform = '';
          setTimeout(() => loaderEl.remove(), 1400);
        }
      }

      const intro = loaderDoneAt === null ? 0 : t - loaderDoneAt;
      const assemble = reduceMotion ? 1 : clamp01((intro - 0.15) / 3.6);
      const settle   = easeInOut(assemble);

      if (!revealed && loaderDoneAt !== null && intro >= (reduceMotion ? 0 : 2.2)) reveal();
      if (!introDone && intro > (reduceMotion ? 0.1 : 3.9)) introDone = true;

      // Hold
      const goal = holding ? 1 : 0;
      burst += (goal - burst) * (1 - Math.exp(-dt * (holding ? 1.5 : 2.4)));
      if (Math.abs(goal - burst) < 0.0005) burst = goal;
      root.style.setProperty('--burst', burst.toFixed(3));
      cursorRing.style.strokeDashoffset = (1 - burst).toFixed(3);

      // Pointer smoothing
      const pk = 1 - Math.exp(-dt * 3);
      smooth.x += ((pointer.active ? pointer.nx : 0) - smooth.x) * pk;
      smooth.y += ((pointer.active ? pointer.ny : 0) - smooth.y) * pk;

      const ck = 1 - Math.exp(-dt * 18);
      cursorPos.x += (pointer.x - cursorPos.x) * ck;
      cursorPos.y += (pointer.y - cursorPos.y) * ck;
      cursorEl.style.transform = `translate3d(${cursorPos.x}px, ${cursorPos.y}px, 0)`;

      // Camera: dolly in from the galaxy, then drift with the pointer
      const introCam = reduceMotion ? 1 : easeOut3(clamp01(intro / 4.4));
      const dist = baseDist * lerp(2.1, 1, introCam) * (1 - burst * 0.1);
      const parallax = introDone ? 1 : clamp01((intro - 3.0) / 1.2);
      camera.position.set(smooth.x * 0.9 * parallax, groupY + smooth.y * 0.5 * parallax + (1 - introCam) * 2.5, dist);
      camLook.set(0, groupY, 0);
      camera.lookAt(camLook);
      camera.rotation.z += (1 - introCam) * 0.35;

      group.position.y = groupY;
      group.rotation.y = smooth.x * 0.3 * parallax + (1 - settle) * 0.6;
      group.rotation.x = -smooth.y * 0.18 * parallax;

      const u = sphereMat.uniforms;
      u.uTime.value = t;
      u.uAssemble.value = assemble;
      u.uBurst.value = burst;
      u.uOpacity.value = reduceMotion ? 1 : clamp01(intro / 0.7);

      dustMat.uniforms.uTime.value = t;
      dustMat.uniforms.uBurst.value = burst;
      dustMat.uniforms.uOpacity.value = reduceMotion ? 1 : clamp01((intro - 0.4) / 2.0);

      bloom.strength = lerp(1.1, 0.35, settle) + burst * 0.35;
      bloom.radius = lerp(0.7, 0.3, settle);
      finalPass.uniforms.uTime.value = t;
      finalPass.uniforms.uAberration.value = (1 - settle) * 0.008 * (intro > 0 ? 1 : 0);
      finalPass.uniforms.uGlow.value = clamp01(intro / 2.5) * (1 + burst * 0.8);

      updateTrail(dt);
      composer.render();
    }

    resize();
    requestAnimationFrame(frame);

    const photoReady = photoEl.complete
      ? Promise.resolve()
      : new Promise(r => { photoEl.addEventListener('load', r, { once: true }); photoEl.addEventListener('error', r, { once: true }); });
    const fontsReady = document.fonts ? document.fonts.ready : Promise.resolve();

    Promise.all([photoReady, fontsReady]).then(() => { ready = true; resize(); });
  </script>
</body>
</html>
